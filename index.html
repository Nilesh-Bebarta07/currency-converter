<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="title">Currency Converter By Nilesh</div>
        <div class="box">
            <div class="FromTo">
                <label for="From">From : </label>
                <select name="From" id="From">
                </select>
                <img class="swapbtn" src="image.png" alt="">
                <label for="To">To : </label>
                <select name="To" id="To">
                </select>
            </div>
            <div class="ammount">
                Amount :
                <input type="text" name="Ammount" id="Ammount" pattern=[0-9]>
            </div>
            <div class="convert">
                Convert
            </div>
            <div class="result"> </div>
            
            
        </div>
    </div>

    <script src="currencies.js"></script>
    <script src="script.js"></script>
</body>

</html>
